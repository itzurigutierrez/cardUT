<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - CardUT</title>
 <link rel="stylesheet" href="css/Login_Registro.css">
</head>
<body>

  <header class="barra-superior"> </header>

  <div class="contenedor">
    <main>
      <h1>Iniciar Sesión</h1>
      <form class="formulario">
        <label for="matricula">Matrícula</label>
        <input type="text" id="matricula" placeholder="Ingrese su matrícula">

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingrese su contraseña">

        <a href="CardUT.html" class="boton" role="button">Confirmar</a>

        <p class="texto-secundario">
          ¿No tienes cuenta? <a href="registro.html">Crear Cuenta</a>
        </p>
      </form>
    </main>
  </div>

</body>
</html>
