<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - CardUT</title>
  <link rel="stylesheet" href="estilos-login.css">
</head>
<body>

  <header class="barra-superior">
  </header>

  <div class="contenedor">
    <main>
      <h1>Registro</h1>
      <form class="formulario">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre">

        <label for="NoReloj">No. Reloj</label>
        <input type="text" id="matricula" placeholder="Ingrese su No. Reloj">

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingrese su contraseña">

        <a href="CardUT.html" class="boton" role="button">Confirmar</a>

        <p class="texto-secundario">
          ¿Ya tienes cuenta? <a href="loginProfe.html">Iniciar Sesión</a>
        </p>
      </form>
    </main>
  </div>

    <footer class="footer"></footer>

</body>
</html>
